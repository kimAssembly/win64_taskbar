name: Windows build and smoke tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build LaptopBar.csproj -c Release
      - name: Installer behavior tests
        shell: pwsh
        run: ./tests/installer-tests.ps1
      - name: WPF and behavior smoke tests
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'bin/Release/net9.0-windows/LaptopBar.exe'
          $process = Start-Process $app -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Smoke test process failed' }
          foreach ($report in @('ui-test.txt', 'popup-gpu-test.txt', 'layout-test.txt')) {
            $text = Get-Content (Join-Path (Split-Path $app) "verification/$report") -Raw
            Write-Output $text
            if (-not $text.StartsWith('PASS:')) { throw "Failed: $report" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LaptopBar-windows-test-results
          path: bin/Release/net9.0-windows/verification/
